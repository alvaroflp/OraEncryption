name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # versões dentro da faixa suportada (12c-21c); XE 21 é a mais antiga disponível nesta imagem
        image: ["gvenzl/oracle-xe:21-slim"]
    steps:
      - uses: actions/checkout@v4

      - name: Subir Oracle
        run: |
          docker run -d --name ora -e ORACLE_PASSWORD=ci_sys_pw -v "$PWD":/work "${{ matrix.image }}"
          for i in $(seq 1 90); do
            s=$(docker inspect --format '{{.State.Health.Status}}' ora)
            echo "health: $s"; [ "$s" = healthy ] && exit 0; sleep 10
          done
          docker logs ora; exit 1

      - name: Criar usuário de teste
        run: docker exec ora sqlplus -S "sys/ci_sys_pw@//localhost:1521/XEPDB1 as sysdba" @/work/tests/ci_setup.sql

      - name: Instalar e testar
        run: |
          docker exec -w /work ora sqlplus -S oraenc/OraEnc_ci_1@//localhost:1521/XEPDB1 @install.sql
          docker exec -w /work ora sqlplus -S oraenc/OraEnc_ci_1@//localhost:1521/XEPDB1 @tests/run_all.sql
